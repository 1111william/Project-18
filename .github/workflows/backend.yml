name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".dockerignore"
      - "compose.yaml"
      - "railway.json"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".dockerignore"
      - "compose.yaml"
      - "railway.json"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: coseat18_test
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
          --health-start-period=15s

    env:
      APP_ENV: test
      DEBUG: "0"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: coseat18_test
      MYSQL_DATABASE: coseat18_test
      DB_SSL_MODE: disabled
      SESSION_COOKIE_SECURE: "0"
      SESSION_COOKIE_SAMESITE: lax
      ALLOWED_ORIGINS: http://localhost:5173
      TRUSTED_PROXY_HEADERS: "0"
      RUN_MYSQL_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate ephemeral CI session secret
        shell: bash
        run: echo "SESSION_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Compile backend source
        run: python -m compileall -q backend/app backend/serve.py

      - name: Apply migrations to disposable MySQL
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Audit migration and model drift
        run: python -m alembic -c backend/alembic.ini check

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -t . -v

      - name: Build production image
        run: docker build --file backend/Dockerfile --tag project18-backend:ci .

      - name: Smoke-test image liveness
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs project18-backend-ci 2>/dev/null || true
            docker rm --force project18-backend-ci 2>/dev/null || true
          }
          trap cleanup EXIT
          container_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"

          docker run --detach \
            --name project18-backend-ci \
            --publish 127.0.0.1:8000:8000 \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --env APP_ENV=test \
            --env DEBUG=0 \
            --env DB_HOST=127.0.0.1 \
            --env DB_PORT=3306 \
            --env DB_USER=unused \
            --env DB_PASSWORD=unused \
            --env DB_NAME=coseat18_container_smoke \
            --env DB_SSL_MODE=disabled \
            --env SESSION_SECRET="$container_secret" \
            --env SESSION_COOKIE_SECURE=0 \
            --env SESSION_COOKIE_SAMESITE=lax \
            --env ALLOWED_ORIGINS=http://localhost:5173 \
            --env TRUSTED_PROXY_HEADERS=0 \
            project18-backend:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/live; then
              exit 0
            fi
            if ! docker inspect --format='{{.State.Running}}' project18-backend-ci | grep --quiet true; then
              exit 1
            fi
            sleep 1
          done
          exit 1
